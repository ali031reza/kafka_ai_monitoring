syntax = "proto3";

package ai_monitoring;

message DeadLetterEvent {
    string camera_id = 1;
    string frame_id = 2;
    string model_id = 3;

    string source_topic = 4;
    int32 source_partition = 5;
    int64 source_offset = 6;

    string error_type = 7;
    string error_message = 8;

    int32 attempts = 9;
    int64 failed_at_ms = 10;
}
