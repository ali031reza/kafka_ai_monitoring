app:
  name: kafka-ai-monitoring
  environment: development

database:
  host: 127.0.0.1
  port: 5432
  name: ai_monitoring
  user: ai_app

kafka:
  bootstrap_servers:
    - 127.0.0.1:9092
  replication_factor: 1
  retention:
    frames_ms: 600000
    results_ms: 86400000
  producer:
    acks: all
    enable_idempotence: true
    compression_type: lz4
    batch_size: 262144
    linger_ms: 5
    delivery_timeout_ms: 120000
  consumer:
    enable_auto_commit: false
    offset_reset: earliest
  results_consumer:
    group_id: results_processor_group
    offset_reset: latest
  retry:
    max_retries: 2
    delay_ms: 200
  dead_letter:
    topic: ai_monitoring.dead_letter
    partitions: 4
    retention_ms: 604800000
  topics:
    car:
      frames: model_1.frames
      results: model_1.results
      partitions: 16
      results_partitions: 4
      group_id: model_1_group
      max_frame_age_ms: 5000
      inference_delay_ms: 30
      detection_probability: 0.50
    fire:
      frames: model_2.frames
      results: model_2.results
      partitions: 16
      results_partitions: 4
      group_id: model_2_group
      max_frame_age_ms: 5000
      inference_delay_ms: 30
      detection_probability: 0.50
    person_face:
      frames: model_3.frames
      results: model_3.results
      partitions: 16
      results_partitions: 4
      group_id: model_3_group
      max_frame_age_ms: 5000
      inference_delay_ms: 30
      detection_probability: 0.50
    ppe:
      frames: model_4.frames
      results: model_4.results
      partitions: 16
      results_partitions: 4
      group_id: model_4_group
      max_frame_age_ms: 5000
      inference_delay_ms: 30
      detection_probability: 0.50

# Phase H load-test planning target.
# Nominal worker target: 20 FPS; plan at 80% utilization = 16 FPS/worker.
# Counts below use the historical routing inventory and must be checked
# against active camera_model_assignments before final capacity sign-off.
workers:
  car: 4
  fire: 6
  person_face: 10
  ppe: 9

cameras:
  total: 40
  fps: 8
  resolution:
    width: 1920
    height: 1080
  encoding: jpeg
  jpeg_quality: 80

routing:
  source: database
  cache:
    enabled: true
    refresh_interval_seconds: 30

storage:
  event_images:
    enabled: true
    root_dir: data/event_images
    format: jpeg
    save_policy: events_only
